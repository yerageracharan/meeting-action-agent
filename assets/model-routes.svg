<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="t d"><title id="t">Choose how the AI runs</title><desc id="d">Compare local models in LM Studio or Ollama with a hosted API.</desc><rect width="1200" height="410" rx="24" fill="#111426"/><text x="35" y="48" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="800">CHOOSE YOUR MODEL ROUTE</text><g font-family="Arial,sans-serif"><rect x="35" y="78" width="550" height="280" rx="18" fill="#152b2d" stroke="#48ccac" stroke-width="2"/><text x="64" y="119" font-size="28" font-weight="800" fill="#a0ffe2">LOCAL MODEL</text><text x="64" y="151" font-size="18" fill="#d3f5eb">LM Studio or Ollama</text><rect x="64" y="175" width="210" height="58" rx="12" fill="#1e4942"/><text x="169" y="210" text-anchor="middle" font-size="19" font-weight="700" fill="#a0ffe2">No provider key</text><g fill="#d3f5eb" font-size="18"><text x="64" y="266">+ Can work offline after download</text><text x="64" y="298">+ Notes stay on your machine</text><text x="64" y="330">− Uses your RAM and GPU</text></g><rect x="615" y="78" width="550" height="280" rx="18" fill="#211b3f" stroke="#9c84ff" stroke-width="2"/><text x="644" y="119" font-size="28" font-weight="800" fill="#d7caff">HOSTED API</text><text x="644" y="151" font-size="18" fill="#e4ddff">OpenAI-compatible provider</text><rect x="644" y="175" width="250" height="58" rx="12" fill="#392c67"/><text x="769" y="210" text-anchor="middle" font-size="19" font-weight="700" fill="#e7dfff">Provider API key</text><g fill="#e4ddff" font-size="18"><text x="644" y="266">+ Lighter demands on your computer</text><text x="644" y="298">+ Many model choices</text><text x="644" y="330">− Needs internet; usage may cost money</text></g></g></svg>