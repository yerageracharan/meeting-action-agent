<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="t d"><title id="t">How the agent avoids inventing meeting tasks</title><desc id="d">Four checks: output structure, exact evidence, missing details and human review.</desc><rect width="1200" height="410" rx="24" fill="#121526"/><text x="35" y="50" fill="#f8f7ff" font-family="Arial,sans-serif" font-size="30" font-weight="800">CHECK THE WORK. DON'T BLINDLY TRUST IT.</text><g font-family="Arial,sans-serif"><g transform="translate(35 90)"><rect width="265" height="255" rx="18" fill="#202744" stroke="#8273ff"/><circle cx="40" cy="40" r="23" fill="#7763ff"/><text x="40" y="48" text-anchor="middle" fill="white" font-size="22" font-weight="800">1</text><text x="25" y="91" fill="#f7f5ff" font-size="22" font-weight="800">VALID STRUCTURE</text><text x="25" y="132" fill="#c7c9e6" font-size="17">Can the response be</text><text x="25" y="156" fill="#c7c9e6" font-size="17">read as the expected</text><text x="25" y="180" fill="#c7c9e6" font-size="17">JSON fields?</text><rect x="25" y="207" width="215" height="29" rx="8" fill="#323b62"/><text x="132" y="227" text-anchor="middle" fill="#b6f0d2" font-size="14">If not: reject</text></g><g transform="translate(330 90)"><rect width="265" height="255" rx="18" fill="#202744" stroke="#8273ff"/><circle cx="40" cy="40" r="23" fill="#7763ff"/><text x="40" y="48" text-anchor="middle" fill="white" font-size="22" font-weight="800">2</text><text x="25" y="91" fill="#f7f5ff" font-size="22" font-weight="800">EVIDENCE QUOTE</text><text x="25" y="132" fill="#c7c9e6" font-size="17">The quoted evidence</text><text x="25" y="156" fill="#c7c9e6" font-size="17">must appear word-for-</text><text x="25" y="180" fill="#c7c9e6" font-size="17">word in the notes.</text><rect x="25" y="207" width="215" height="29" rx="8" fill="#323b62"/><text x="132" y="227" text-anchor="middle" fill="#b6f0d2" font-size="14">If not: reject</text></g><g transform="translate(625 90)"><rect width="265" height="255" rx="18" fill="#30243b" stroke="#d58bc1"/><circle cx="40" cy="40" r="23" fill="#b35796"/><text x="40" y="48" text-anchor="middle" fill="white" font-size="22" font-weight="800">3</text><text x="25" y="91" fill="#fff5fc" font-size="22" font-weight="800">MISSING DETAILS</text><text x="25" y="132" fill="#efd6e8" font-size="17">No owner? No date?</text><text x="25" y="156" fill="#efd6e8" font-size="17">Keep it unknown and</text><text x="25" y="180" fill="#efd6e8" font-size="17">mark it for review.</text><rect x="25" y="207" width="215" height="29" rx="8" fill="#563752"/><text x="132" y="227" text-anchor="middle" fill="#ffe2a1" font-size="14">Don't guess</text></g><g transform="translate(920 90)"><rect width="245" height="255" rx="18" fill="#19342c" stroke="#58c995"/><circle cx="40" cy="40" r="23" fill="#358d65"/><text x="40" y="48" text-anchor="middle" fill="white" font-size="22" font-weight="800">4</text><text x="25" y="91" fill="#eafff1" font-size="22" font-weight="800">HUMAN REVIEW</text><text x="25" y="132" fill="#c9f0d9" font-size="17">The checks catch some</text><text x="25" y="156" fill="#c9f0d9" font-size="17">problems, not every</text><text x="25" y="180" fill="#c9f0d9" font-size="17">wrong interpretation.</text><rect x="25" y="207" width="195" height="29" rx="8" fill="#28553e"/><text x="122" y="227" text-anchor="middle" fill="#b6f0d2" font-size="14">Review before sharing</text></g></g></svg>