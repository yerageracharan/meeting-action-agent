<path d="M506 260h30l-10-10m10 10-10 10" stroke="#aca5ff" stroke-width="4" fill="none"/><g transform="translate(548 125)"><rect width="205" height="270" rx="18" fill="#202541" stroke="#6353df"/><circle cx="30" cy="31" r="20" fill="#7c69ff"/><text x="30" y="38" text-anchor="middle" fill="white" font-size="20" font-weight="700">3</text><text x="23" y="85" fill="#f7f5ff" font-size="23" font-weight="800">VALIDATE</text><g fill="#79d6a1"><circle cx="33" cy="124" r="9"/><circle cx="33" cy="158" r="9"/><circle cx="33" cy="192" r="9"/></g><g stroke="#102118" stroke-width="3" fill="none"><path d="M28 124l4 4 6-8M28 158l4 4 6-8M28 192l4 4 6-8"/></g><g fill="#d4d8f1" font-size="15"><text x="50" y="129">Valid JSON</text><text x="50" y="163">Evidence quote</text><text x="50" y="197">Required fields</text></g><text x="22" y="238" fill="#c4c8e4" font-size="16">Reject unsupported tasks</text></g>
<path d="M764 260h30l-10-10m10 10-10 10" stroke="#aca5ff" stroke-width="4" fill="none"/><g transform="translate(806 125)"><rect width="165" height="270" rx="18" fill="#33273d" stroke="#d68fbd"/><circle cx="30" cy="31" r="20" fill="#b95f91"/><text x="30" y="38" text-anchor="middle" fill="white" font-size="20" font-weight="700">4</text><text x="23" y="85" fill="#fff6fc" font-size="22" font-weight="800">FLAG GAPS</text><text x="22" y="124" fill="#f4cadd" font-size="16">No owner?</text><text x="22" y="150" fill="#f4cadd" font-size="16">No deadline?</text><path d="M22 172H140" stroke="#986885" stroke-width="3"/><text x="22" y="205" fill="#fff6fc" font-size="15">Mark for review</text><text x="22" y="238" fill="#d9bfd1" font-size="15">Never guess</text></g>
