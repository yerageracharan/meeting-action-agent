<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">How Meeting Action Agent works</title><desc id="d">Five steps transform meeting notes into an evidence-checked action plan.</desc><rect width="1200" height="470" rx="24" fill="#111426"/><text x="40" y="52" fill="#f4f3ff" font-family="Arial,sans-serif" font-weight="800" font-size="30">FROM MESSY NOTES TO USEFUL ACTION</text><text x="40" y="82" fill="#adb4d7" font-family="Arial,sans-serif" font-size="17">No magic. A clear pipeline, evidence checks, and human review.</text>
<g font-family="Arial,sans-serif"><g transform="translate(32 125)"><rect width="205" height="270" rx="18" fill="#f8e9d4"/><circle cx="30" cy="31" r="20" fill="#b86443"/><text x="30" y="38" text-anchor="middle" fill="white" font-size="20" font-weight="700">1</text><text x="23" y="85" fill="#28211d" font-size="23" font-weight="800">NOTES</text><path d="M25 115H175M25 140H160M25 165H180M25 190H130" stroke="#baab99" stroke-width="8" stroke-linecap="round"/><text x="22" y="238" fill="#675449" font-size="16">Paste plain text</text></g>
