<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">A rough local model hardware guide</title><desc id="d">Practical starting points for lower, medium and higher RAM computers.</desc><rect width="1200" height="440" rx="24" fill="#15182b"/><text x="35" y="50" fill="#f7f4ff" font-family="Arial,sans-serif" font-size="30" font-weight="800">WHAT CAN YOUR COMPUTER RUN?</text><text x="35" y="80" fill="#bac0dd" font-family="Arial,sans-serif" font-size="17">Rough starting points only. Always check the actual model size and app's memory estimate.</text><g font-family="Arial,sans-serif"><g transform="translate(35 110)"><rect width="350" height="285" rx="18" fill="#33293b" stroke="#e0a35e" stroke-width="2"/><text x="25" y="43" fill="#ffe5bf" font-size="23" font-weight="800">ENTRY LEVEL</text><text x="25" y="74" fill="#ffe5bf" font-size="18">8 GB RAM or less</text><rect x="25" y="100" width="300" height="55" rx="12" fill="#4b3748"/><text x="175" y="134" text-anchor="middle" fill="#fff1dc" font-size="21" font-weight="700">Try 1B–3B models</text><text x="25" y="194" fill="#ead5c1" font-size="17">• Use a small quantized model</text><text x="25" y="224" fill="#ead5c1" font-size="17">• Close memory-heavy apps</text><text x="25" y="254" fill="#ead5c1" font-size="17">• Expect slower responses</text></g><g transform="translate(425 110)"><rect width="350" height="285" rx="18" fill="#173239" stroke="#59d0bd" stroke-width="2"/><text x="25" y="43" fill="#b8fff1" font-size="23" font-weight="800">MID RANGE</text><text x="25" y="74" fill="#b8fff1" font-size="18">16 GB RAM</text><rect x="25" y="100" width="300" height="55" rx="12" fill="#21464b"/><text x="175" y="134" text-anchor="middle" fill="#e2fffa" font-size="21" font-weight="700">Try 3B–8B models</text><text x="25" y="194" fill="#c7e9e8" font-size="17">• Often a useful starting range</text><text x="25" y="224" fill="#c7e9e8" font-size="17">• Check GPU VRAM too</text><text x="25" y="254" fill="#c7e9e8" font-size="17">• Context size affects memory</text></g><g transform="translate(815 110)"><rect width="350" height="285" rx="18" fill="#202342" stroke="#8b80ff" stroke-width="2"/><text x="25" y="43" fill="#d6d0ff" font-size="23" font-weight="800">HIGHER MEMORY</text><text x="25" y="74" fill="#d6d0ff" font-size="18">32 GB RAM or more</text><rect x="25" y="100" width="300" height="55" rx="12" fill="#35355f"/><text x="175" y="134" text-anchor="middle" fill="#e9e6ff" font-size="21" font-weight="700">Try 8B+ cautiously</text><text x="25" y="194" fill="#d6d4ed" font-size="17">• More room for larger models</text><text x="25" y="224" fill="#d6d4ed" font-size="17">• Dedicated VRAM can help</text><text x="25" y="254" fill="#d6d4ed" font-size="17">• Larger models can still fail</text></g></g></svg>