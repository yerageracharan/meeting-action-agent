<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Connect Meeting Action Agent to LM Studio</title><desc id="d">Download LM Studio, download a model, start the local server, copy the model ID, and run the agent.</desc><rect width="1200" height="420" rx="24" fill="#131629"/><text x="38" y="52" fill="#f8f6ff" font-family="Arial,sans-serif" font-size="30" font-weight="800">LOCAL AI IN FIVE STEPS</text><text x="38" y="82" fill="#babfe1" font-family="Arial,sans-serif" font-size="17">The model runs on your computer. The agent talks to it through localhost.</text><g font-family="Arial,sans-serif"><g transform="translate(35 120)"><rect width="205" height="245" rx="17" fill="#202844" stroke="#827bff"/><circle cx="32" cy="32" r="20" fill="#7e70ff"/><text x="32" y="39" text-anchor="middle" fill="white" font-size="20" font-weight="800">1</text><rect x="25" y="70" width="155" height="75" rx="10" fill="#111426" stroke="#7e70ff"/><path d="M50 126V91h102v35M43 137h116" stroke="#c7c2ff" stroke-width="4" fill="none"/><text x="22" y="178" fill="#f8f6ff" font-size="20" font-weight="700">Install</text><text x="22" y="207" fill="#c4c9e4" font-size="15">Download LM Studio</text><text x="22" y="228" fill="#c4c9e4" font-size="15">from its official site.</text></g><path d="M250 242h23l-8-8m8 8-8 8" stroke="#a79fff" stroke-width="4" fill="none"/><g transform="translate(280 120)"><rect width="205" height="245" rx="17" fill="#202844" stroke="#827bff"/><circle cx="32" cy="32" r="20" fill="#7e70ff"/><text x="32" y="39" text-anchor="middle" fill="white" font-size="20" font-weight="800">2</text><rect x="25" y="70" width="155" height="75" rx="10" fill="#111426"/><path d="M102 86l-26 20h52Z" fill="#8e81ff"/><rect x="72" y="106" width="60" height="24" rx="4" fill="#5a4eb0"/><text x="22" y="178" fill="#f8f6ff" font-size="20" font-weight="700">Get a model</text><text x="22" y="207" fill="#c4c9e4" font-size="15">Choose a small</text><text x="22" y="228" fill="#c4c9e4" font-size="15">model that fits RAM.</text></g><path d="M495 242h23l-8-8m8 8-8 8" stroke="#a79fff" stroke-width="4" fill="none"/><g transform="translate(525 120)"><rect width="205" height="245" rx="17" fill="#202844" stroke="#827bff"/><circle cx="32" cy="32" r="20" fill="#7e70ff"/><text x="32" y="39" text-anchor="middle" fill="white" font-size="20" font-weight="800">3</text><rect x="25" y="70" width="155" height="75" rx="10" fill="#111426"/><circle cx="102" cy="107" r="27" stroke="#71dbb1" stroke-width="4" fill="none"/><path d="M89 108l9 9 18-23" stroke="#71dbb1" stroke-width="5" fill="none"/><text x="22" y="178" fill="#f8f6ff" font-size="20" font-weight="700">Start server</text><text x="22" y="207" fill="#c4c9e4" font-size="15">Open Developer and</text><text x="22" y="228" fill="#c4c9e4" font-size="15">start local server.</text></g><path d="M740 242h23l-8-8m8 8-8 8" stroke="#a79fff" stroke-width="4" fill="none"/><g transform="translate(770 120)"><rect width="175" height="245" rx="17" fill="#202844" stroke="#827bff"/><circle cx="32" cy="32" r="20" fill="#7e70ff"/><text x="32" y="39" text-anchor="middle" fill="white" font-size="20" font-weight="800">4</text><rect x="20" y="70" width="135" height="75" rx="10" fill="#111426"/><text x="87" y="100" text-anchor="middle" fill="#9cf1d2" font-size="14">MODEL ID</text><path d="M35 119H140" stroke="#b6b6da" stroke-width="4"/><text x="20" y="178" fill="#f8f6ff" font-size="19" font-weight="700">Copy ID</text><text x="20" y="207" fill="#c4c9e4" font-size="15">Use the exact ID</text><text x="20" y="228" fill="#c4c9e4" font-size="15">from the server.</text></g><path d="M955 242h23l-8-8m8 8-8 8" stroke="#a79fff" stroke-width="4" fill="none"/><g transform="translate(985 120)"><rect width="180" height="245" rx="17" fill="#19372e" stroke="#64d4a4"/><circle cx="32" cy="32" r="20" fill="#358e69"/><text x="32" y="39" text-anchor="middle" fill="white" font-size="20" font-weight="800">5</text><rect x="25" y="70" width="130" height="75" rx="10" fill="#10241f"/><path d="M46 100h88M46 114h62" stroke="#71dbb1" stroke-width="5" stroke-linecap="round"/><text x="20" y="178" fill="#e9fff4" font-size="19" font-weight="700">Run agent</text><text x="20" y="207" fill="#c5ebdd" font-size="15">Generate and review</text><text x="20" y="228" fill="#c5ebdd" font-size="15">the action plan.</text></g></g></svg>