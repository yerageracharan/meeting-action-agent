name: Bug report
description: Report a reproducible defect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Use synthetic notes. Never include private meeting transcripts, personal data, API keys, or tokens."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include a synthetic note sample, command, and redacted provider/model settings.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit SHA / version
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
  - type: dropdown
    id: provider
    attributes:
      label: Model provider
      options:
        - Local Ollama
        - LM Studio
        - OpenAI-compatible hosted endpoint
        - Other
        - Not provider-related
    validations:
      required: true
