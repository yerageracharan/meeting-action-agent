name: Build Local AI Setup PDF

on:
  push:
    branches: [main]
    paths:
      - "docs/Local-AI-and-API-Setup-Guide.md"
      - "assets/*.svg"
      - ".github/scripts/build_setup_pdf.py"
      - ".github/workflows/build-setup-guide-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependencies
        run: python -m pip install reportlab svglib
      - name: Build PDF from Markdown guide and SVG visuals
        run: python .github/scripts/build_setup_pdf.py
      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Local-AI-and-API-Setup-Guide.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "Build visual Local AI setup PDF"
            git push
          fi
