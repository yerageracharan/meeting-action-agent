name: Build Local AI Setup PDF

on:
  push:
    branches: [main]
    paths:
      - "docs/Local-AI-and-API-Setup-Guide.md"
      - "assets/*.svg"
      - ".github/scripts/build_setup_pdf.py"
      - ".github/workflows/build-setup-guide-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meeting-action-guide-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PDF dependencies
        run: python -m pip install reportlab svglib
      - name: Build PDF from Markdown guide and SVG visuals
        run: python .github/scripts/build_setup_pdf.py
      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Local-AI-and-API-Setup-Guide.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "Build visual Local AI setup PDF"
            git push
          fi
